<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fafbf7"><meta name="description" content="Ridian daily task history."><title>Ridian · History</title><link rel="icon" type="image/svg+xml" href="favicon.svg"><link rel="stylesheet" href="journal.css"><script type="module" src="journal.js"></script></head>
<body>
<div class="page">
  <header class="topbar"><a class="brand" href="/" aria-label="Ridian home"><span class="brand-dot" aria-hidden="true"></span><span>Ridian</span></a><span id="connection-state" class="connection-state"><i></i>Connecting</span></header>
  <main>
    <section class="intro"><h1>History</h1></section>
    <section id="connection-panel" class="connection-panel" hidden>
      <p>Open Ridian → Online history.</p>
      <div class="connection-actions"><button id="retry" class="primary">Connect</button><button id="demo" class="quiet-button">Demo</button></div>
    </section>
    <div id="notice" class="notice" role="status" hidden></div>
    <section class="activity-section" aria-labelledby="activity-title">
      <div class="section-heading"><h2 id="activity-title">Activity</h2><div class="year-picker"><button id="previous-year" aria-label="Previous year">‹</button><span id="year-label"></span><button id="next-year" aria-label="Next year">›</button></div></div>
      <div class="activity-scroll"><div class="activity-inner"><div id="month-labels" class="month-labels"></div><div class="activity-body"><div class="weekday-labels"><span>M</span><span>W</span><span>F</span><span>S</span></div><div id="heatmap" class="heatmap" aria-label="Daily completions"></div></div></div></div>
      <div class="activity-caption"><p id="year-summary">0 completed</p><div class="legend" aria-label="Completion scale"><span>Less</span><i class="level-0"></i><i class="level-1"></i><i class="level-2"></i><i class="level-3"></i><i class="level-4"></i><span>More</span></div></div>
    </section>
    <section class="journal-section" aria-label="Daily history">
      <div class="day-page"><div class="day-heading"><div><h3 id="selected-title"></h3><p id="selected-subtitle"></p></div><div class="day-navigation"><button id="back-today" class="today-button">Today</button><button id="previous-day" aria-label="Previous day">‹</button><label class="date-control" title="Choose date"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4.5" width="14" height="13" rx="2"/><path d="M6 2.5v4m8-4v4M3 9h14"/></svg><input id="date-picker" type="date" aria-label="Choose date"></label><button id="next-day" aria-label="Next day">›</button></div></div>
      <ul id="day-tasks" class="day-tasks"></ul><div id="day-empty" class="day-empty"><p>No tasks</p></div></div>
    </section>
  </main>
  <footer class="page-footer"><details id="data-details"><summary>Data</summary><div class="data-panel"><div class="data-actions"><button id="export" class="quiet-button">Export JSON</button><label class="quiet-button import-label">Open backup<input id="import" type="file" accept="application/json,.json"></label><button id="disconnect" class="quiet-button">Disconnect</button></div><form id="connect-form"><label for="connection-key">Read-only key</label><div><input id="connection-key" type="password" placeholder="Paste key" autocomplete="off"><button type="submit">Connect</button></div></form></div></details></footer>
</div>
<div id="toast" class="toast" role="status" hidden></div>
</body></html>
